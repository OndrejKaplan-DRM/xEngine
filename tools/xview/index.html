<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xView: prohlížeč balíku xSpace</title>
<style>
html,body{margin:0;height:100%;background:#0b0d12;color:#d8dbe2;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#panel{position:absolute;left:12px;top:12px;max-width:440px;background:rgba(14,17,24,.86);border:1px solid #2a3040;border-radius:8px;padding:10px 12px}
#panel b{font-weight:600;color:#fff}
#ver{color:#8b93a5;font-size:12px;margin-bottom:4px}
.good{color:#5dcaa5}.bad{color:#f09595}
ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px}
li i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
button{background:#1a1f2b;color:#d8dbe2;border:1px solid #2f3647;border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
button:hover{border-color:#5dcaa5}button.on{background:#12352b;border-color:#5dcaa5;color:#fff}
#hint{position:absolute;right:12px;bottom:10px;color:#8b93a5;font-size:12px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <div id="ver"></div>
  <div id="info"></div>
  <ul id="cells"></ul>
  <div class="row" id="views"></div>
  <div class="row" id="toggles"></div>
</div>
<div id="hint">tažení myší otáčí · kolečko přibližuje · pravé tlačítko posouvá</div>
<script>/*__DATA__*/</script>
<script>/*__JS__*/</script>
</body>
</html>
